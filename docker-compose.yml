services:
  postgres:
    profiles: ["local-db"] 
    image: pgvector/pgvector:pg16
    container_name: local_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: local_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: 
      - django_docker_db_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: local_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes: [ "minio_data:/data" ]
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # API Django (ASGI)
  web:
    build: .
    container_name: django_web
    working_dir: /app
    command:
      [
        "sh","-lc",
        "python manage.py migrate && \
        exec gunicorn config.asgi:application \
        -k uvicorn.workers.UvicornWorker \
        -b 0.0.0.0:8000 \
        --workers=${WEB_CONCURRENCY:-1} \
        --threads=${WEB_THREADS:-8} \
        --timeout=${WEB_TIMEOUT:-120} \
        --graceful-timeout=30 \
        --keep-alive=5 \
        --max-requests=1000 \
        --max-requests-jitter=100 \
        --worker-tmp-dir=/dev/shm \
        --access-logfile=- \
        --error-logfile=-"
      ]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TRANSFORMERS_NO_TORCHVISION: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - django_docker_db_hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    shm_size: 1g
    mem_limit: 2g
    memswap_limit: 3g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s


  # Worker Celery
  worker:
    build: .
    container_name: celery_worker
    command: bash -lc "celery -A config.celery:app worker -Q ingestion,extraction,chunking,embedding -l INFO --concurrency=2"
    env_file:
      - .env
    volumes:
      - ./:/app
      - django_docker_db_hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Programador Celery Beat
  beat:
    build: .
    container_name: celery_beat
    working_dir: /app
    command: >
      sh -lc "celery -A config.celery:app beat -l INFO"
    env_file: [ .env ]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
    volumes:
      - ./:/app
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  minio_data:
  django_docker_db_redis_data:            
    external: true
    name: django_docker_db_redis_data
  django_docker_db_hf_cache:
    external: true   
