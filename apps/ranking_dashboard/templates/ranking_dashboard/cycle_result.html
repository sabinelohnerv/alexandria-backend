{% extends 'ranking_dashboard/base.html' %}

{% block title %}Resultado del Ciclo - Ranking Adaptativo{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-900">Resultado del Ciclo Completo</h2>
        <p class="text-gray-600 mt-1">Resumen de la ejecución</p>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Output del Proceso</h3>
        <pre class="bg-gray-50 p-4 rounded-md overflow-x-auto text-sm text-gray-800 whitespace-pre-wrap">{{ output }}</pre>
    </div>

    <div class="flex space-x-3">
        <a href="{% url 'ranking_dashboard:home' %}" class="bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-900 font-medium">
            Volver al Dashboard
        </a>
        <a href="{% url 'ranking_dashboard:versions' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 font-medium">
            Ver Versiones
        </a>
    </div>
</div>
{% endblock %}
