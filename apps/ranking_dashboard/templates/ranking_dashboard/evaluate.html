{% extends 'ranking_dashboard/base.html' %}

{% block title %}Evaluación - {{ version }}{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-900">Evaluación de Versión</h2>
        <p class="text-gray-600 mt-1">{{ version }}</p>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Resultados de Evaluación</h3>
        <pre class="bg-gray-50 p-4 rounded-md overflow-x-auto text-sm text-gray-800 whitespace-pre-wrap">{{ evaluation_output }}</pre>
    </div>

    <div class="flex space-x-3">
        <a href="{% url 'ranking_dashboard:versions' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 font-medium">
            Volver a Versiones
        </a>
        <form method="post" action="{% url 'ranking_dashboard:activate' version %}" class="inline" id="activateForm">
            {% csrf_token %}
            <button type="submit" class="bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-900 font-medium">
                Activar Esta Versión
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('activateForm').addEventListener('submit', function(e) {
        if (confirm('¿Activar esta versión en producción?')) {
            const overlay = document.getElementById('loadingOverlay');
            const text = document.getElementById('loadingText');
            text.textContent = 'Activando versión {{ version }}...';
            overlay.classList.add('active');
        } else {
            e.preventDefault();
        }
    });
</script>
{% endblock %}
